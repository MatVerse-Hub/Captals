name: Captals Metabolism

on:
  push:
    branches:
      - feat/captals-metabolism-fusion
    paths:
      - 'backend/services/captals_metabolism.py'
      - 'backend/routes/captals.py'
      - 'backend/test_captals_metabolism.py'
      - 'backend/main.py'
      - 'CAPTALS_FUSION.md'
      - '.github/workflows/captals-metabolism.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/services/captals_metabolism.py'
      - 'backend/routes/captals.py'
      - 'backend/test_captals_metabolism.py'
      - 'backend/main.py'
      - 'CAPTALS_FUSION.md'
      - '.github/workflows/captals-metabolism.yml'

permissions:
  contents: read

concurrency:
  group: captals-metabolism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metabolism:
    name: Captals metabolism contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install isolated test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi==0.104.1 \
            pydantic==2.5.0 \
            httpx==0.25.2 \
            pytest==7.4.3

      - name: Syntax check
        working-directory: backend
        run: |
          python -m py_compile services/captals_metabolism.py routes/captals.py test_captals_metabolism.py

      - name: Run Captals metabolism tests
        working-directory: backend
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: pytest -q test_captals_metabolism.py
